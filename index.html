<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Splitticket">
<meta name="theme-color" content="#eef1f6">
<title>Splitticket</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#eef1f6; --card:#ffffff; --line:#dde3eb; --divider:#e6ebf1; --track:#e4e9f0;
  --ink:#14202b; --muted:#5d6874; --accent:#1f5fd1; --accent-soft:rgba(31,95,209,.12); --on-accent:#ffffff;
  --ok:#1d8a55; --warn:#b4660f; --av-off:#a7b1bd; --seg:#dfe5ed; --seg-on:#ffffff;
  --glass:rgba(255,255,255,.58); --glass-line:rgba(255,255,255,.75); --glass-shadow:0 10px 30px rgba(20,32,50,.16), inset 0 1px 0 rgba(255,255,255,.95);
  --qr-bg:#1f5fd1; --dim:rgba(8,14,22,.5); --headbg:rgba(238,241,246,.93);
  --display:"Bricolage Grotesque",-apple-system,system-ui,sans-serif;
  --body:-apple-system,"SF Pro Text",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-app="light"]){
  --bg:#0d1217; --card:#171f28; --line:#26323f; --divider:#26323f; --track:#26323f;
  --ink:#e7edf2; --muted:#9aa7b4; --accent:#8fb2ff; --accent-soft:rgba(143,178,255,.16); --on-accent:#0d1217;
  --ok:#4cc38a; --warn:#f0a54a; --av-off:#4a5664; --seg:#1f2a35; --seg-on:#3a4757;
  --glass:rgba(36,46,58,.62); --glass-line:rgba(255,255,255,.12); --glass-shadow:0 10px 30px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.12);
  --qr-bg:#1b3f86; --dim:rgba(0,0,0,.6); --headbg:rgba(13,18,23,.92); color-scheme:dark}}
:root[data-app="dark"]{
  --bg:#0d1217; --card:#171f28; --line:#26323f; --divider:#26323f; --track:#26323f;
  --ink:#e7edf2; --muted:#9aa7b4; --accent:#8fb2ff; --accent-soft:rgba(143,178,255,.16); --on-accent:#0d1217;
  --ok:#4cc38a; --warn:#f0a54a; --av-off:#4a5664; --seg:#1f2a35; --seg-on:#3a4757;
  --glass:rgba(36,46,58,.62); --glass-line:rgba(255,255,255,.12); --glass-shadow:0 10px 30px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.12);
  --qr-bg:#1b3f86; --dim:rgba(0,0,0,.6); --headbg:rgba(13,18,23,.92); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
body{overscroll-behavior-y:none}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 var(--body);
  padding:calc(20px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(130px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#app{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.lbody{display:flex;flex-direction:column;gap:14px}
.lhead{position:sticky;top:0;z-index:3;display:flex;flex-direction:column;gap:10px;
  margin:calc(-20px - env(safe-area-inset-top,0px)) calc(-1 * max(16px,env(safe-area-inset-right,0px))) 0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));
  padding:calc(20px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));
  background:var(--headbg);-webkit-backdrop-filter:saturate(1.8) blur(18px);backdrop-filter:saturate(1.8) blur(18px);border-bottom:1px solid transparent;transition:border-color .2s}
.lhead .topbar{margin:-8px 0 -6px}
body.scrolled .lhead{border-bottom-color:var(--line)}
body.swiping{background:var(--seg)}
body.swiping #app{box-shadow:-14px 0 28px rgba(0,0,0,.14)}
h1{margin:0;font:800 34px/1.05 var(--display);letter-spacing:-.02em;text-wrap:balance}
.lead{margin:0;font-size:15px;color:var(--muted)}
.lead b{color:var(--ink);font-family:var(--mono)}
.head{display:flex;flex-direction:column;gap:4px;padding:0 4px}
.cap{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.tap{cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .12s ease}
.tap:active{transform:scale(.985)}
.tap:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.col{display:flex;flex-direction:column;gap:2px;min-width:0}
.right{align-items:flex-end;text-align:right}
.t1{font-size:17px;font-weight:600}
.t2{font-size:13px;color:var(--muted)}
.amt{font:600 17px var(--mono)}
.bar{height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.bar>span{display:block;height:100%;border-radius:3px;background:var(--accent)}
.bar>span.full{background:var(--ok)}
.avs{display:flex}
.av{width:28px;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;border:2px solid var(--card);flex:none}
.avs .av+.av{margin-left:-8px}
.av.off{background:var(--av-off)}
.av.big{width:44px;height:44px;border-radius:22px;font-size:15px;border:none}
.av.mid{width:36px;height:36px;border-radius:18px;font-size:13px;border:none}
.foot{display:flex;align-items:center;gap:10px;border-top:1px solid var(--divider);padding-top:12px}
.foot .t2{flex:1;min-width:0}
button,.btn{--spin:var(--accent);position:relative;font:600 15px var(--body);border-radius:22px;min-height:44px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-decoration:none;border:1px solid var(--line);background:var(--card);color:var(--ink);-webkit-tap-highlight-color:transparent;
  transition:transform .14s cubic-bezier(.2,.8,.2,1),background-color .22s,border-color .22s,color .22s,filter .14s,opacity .2s}
button:active:not(:disabled),.btn:active{transform:scale(.96);filter:brightness(.9)}
.tab:active:not(:disabled){transform:scale(.93)}
.cam:active{transform:scale(.9)}
.step button:active:not(:disabled){transform:scale(.86)}
button:focus-visible,.btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.5}
.btn-p{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn-dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn-soft{background:var(--accent-soft);border-color:transparent;color:var(--accent);min-height:40px;flex:none}
.btn-link{border:none;background:none;color:var(--accent);padding:0 4px;min-height:44px;font-size:17px;font-weight:400}
.linkbtn{border:none;background:none;padding:4px 0;min-height:0;color:var(--accent);font-size:13px;font-weight:600;align-self:flex-start}
.btn-big{height:64px;border-radius:16px;font-size:17px}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pill{align-self:flex-start;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;border:1px solid currentColor;flex:none}
.ok{color:var(--ok)} .warn{color:var(--warn)}
.list{padding:4px 16px;gap:0}
.line{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0}
.line+.line{border-top:1px dashed var(--line)}
.line .name{font-size:16px;font-weight:600}
.line.mine .name{color:var(--accent)}
.line.gone{opacity:.5}
.step{display:flex;align-items:center;gap:8px}
.step button{width:40px;height:40px;min-height:40px;padding:0;border-radius:20px;font-size:20px;background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.step button:disabled{opacity:.35}
.step .q{min-width:20px;text-align:center;font:600 17px var(--mono)}
.person{display:flex;align-items:center;gap:12px;padding:12px 0}
.person+.person{border-top:1px solid var(--divider)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:38px;border-radius:19px;padding:0 14px;font-size:15px;font-weight:600;border:1px solid transparent;background:var(--accent-soft);color:var(--accent);display:inline-flex;align-items:center;gap:4px}
.chip.sug{background:var(--seg);color:var(--ink)}
.line .chip{white-space:nowrap;flex:none}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.chip .x{width:28px;height:28px;min-height:0;padding:0;margin-right:-8px;border:none;border-radius:14px;background:none;color:inherit;font-size:18px}
.empty{padding:28px 20px;text-align:center;align-items:center}
.empty p{margin:0;color:var(--muted);max-width:30ch}
.topbar{display:flex;justify-content:space-between;align-items:center;margin:-8px 0 -4px}
.status{font-size:13px;font-weight:600;color:var(--ok)}
.edit{display:grid;grid-template-columns:minmax(0,1fr) 3.6rem 5.2rem 2.6rem;gap:6px;align-items:center}
.erow{display:flex;flex-direction:column;gap:8px;padding:12px 0}
.erow+.erow{border-top:1px dashed var(--line)}
.erow-top{display:flex;gap:8px;align-items:center}
.erow-top input{font-weight:600}
.erow-nums{display:grid;grid-template-columns:4.2rem minmax(0,1fr) minmax(0,1fr);gap:8px}
.erow-nums label{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.erow .x{width:2.6rem;height:2.6rem;min-height:0;padding:0;border-radius:50%;flex:none}
input,textarea{font:16px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;min-width:0}
textarea{min-height:120px;resize:vertical}
input.n{font-family:var(--mono);text-align:right}
.edit .x{width:2.6rem;height:2.6rem;min-height:0;padding:0;border-radius:50%}
.field{display:flex;flex-direction:column;gap:6px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;border-radius:14px;background:var(--seg)}
.seg button{border:none;background:none;border-radius:10px;min-height:40px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--seg-on);color:var(--ink);box-shadow:0 1px 3px rgba(20,32,50,.12)}
.stat .v{font:600 22px var(--mono)}
.photo{width:100%;border-radius:12px;display:block}
.how{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;color:var(--muted);font-size:14px}
.code{font:500 12px var(--mono);color:var(--muted);word-break:break-all;background:var(--bg);border-radius:10px;padding:10px}
.isteps{display:flex;flex-direction:column;gap:14px}
.istep{display:flex;gap:12px;align-items:flex-start}
.istep .ic{width:40px;height:40px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent)}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:5;pointer-events:none;
  padding:0 max(16px,env(safe-area-inset-right,0px)) max(10px,calc(env(safe-area-inset-bottom,0px) - 6px)) max(16px,env(safe-area-inset-left,0px))}
.tabbar .in{max-width:520px;margin:0 auto;display:flex;gap:12px;align-items:center;pointer-events:auto}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(1.8);backdrop-filter:blur(20px) saturate(1.8);border:1px solid var(--glass-line);box-shadow:var(--glass-shadow)}
.tabs{flex:1;height:64px;border-radius:32px;display:flex;align-items:center;padding:4px;gap:2px}
.tab{flex:1;height:56px;min-height:0;border-radius:28px;border:none;background:none;flex-direction:column;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:0}
.tab[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.cam{width:64px;height:64px;min-height:0;padding:0;border-radius:32px;background:var(--accent);color:var(--on-accent);border:1px solid var(--glass-line);box-shadow:0 10px 30px rgba(31,95,209,.35),inset 0 1px 0 rgba(255,255,255,.45);flex:none}
.paybar{flex:1;border-radius:32px;padding:10px 10px 10px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.paybar .v{font:600 24px var(--mono)}
.paybar .btn{height:52px;border-radius:26px;font-size:17px}

.layer{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;gap:22px;overflow:auto;
  padding:calc(20px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.layer.qr{background:var(--qr-bg);color:#fff}
.layer.qr .btn-link{color:#fff}
.layer.sheet{background:var(--bg);justify-content:center}
.layer.dim{background:var(--dim);justify-content:flex-end}
.layer.read{background:#101418;color:#fff;justify-content:center}
/* live camera */
#camera{position:fixed;inset:0;z-index:40;background:#000;color:#fff;overflow:hidden;touch-action:none}
body.cam-open{overflow:hidden}
.cam-stage{position:absolute;inset:0;transform-origin:50% 50%;transition:transform .55s cubic-bezier(.2,.8,.2,1)}
#camVideo{display:block;width:100%;height:100%;object-fit:cover}
.cam-frame{position:absolute;left:12%;top:16%;width:76%;height:58%;border-radius:16px;box-shadow:0 0 0 200vmax rgba(0,0,0,.28);
  transition:left .38s cubic-bezier(.2,.8,.2,1),top .38s cubic-bezier(.2,.8,.2,1),width .38s cubic-bezier(.2,.8,.2,1),height .38s cubic-bezier(.2,.8,.2,1),box-shadow .3s}
.cam-frame i{position:absolute;width:30px;height:30px;border:4px solid #ffd60a;transition:border-color .2s}
.cam-frame i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0;border-top-left-radius:16px}
.cam-frame i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0;border-top-right-radius:16px}
.cam-frame i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0;border-bottom-left-radius:16px}
.cam-frame i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0;border-bottom-right-radius:16px}
.cam-frame.found{box-shadow:0 0 0 200vmax rgba(0,0,0,.5)}
.cam-frame.found i{border-color:#34c759;width:18px;height:18px;border-width:3px}
.cam-top{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top,0px) + 14px) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.cam-bottom{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;
  padding:0 max(24px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 30px) max(24px,env(safe-area-inset-left,0px))}
.cam-glass{width:48px;height:48px;min-height:0;padding:0;border-radius:24px;color:#fff;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);flex:none}
.cam-glass.sq{border-radius:14px}
.cam-pill{font-size:14px;font-weight:600;padding:9px 14px;border-radius:18px;background:rgba(0,0,0,.4);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);text-align:center;min-width:0}
.cam-pill.good{background:rgba(29,138,85,.85)}
.shutter{width:82px;height:82px;min-height:0;border-radius:41px;border:5px solid #fff;background:transparent;padding:5px;flex:none}
.shutter span{display:block;width:100%;height:100%;border-radius:50%;background:#fff;transition:transform .12s}
.shutter:active span{transform:scale(.86)}
.cam-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.cam-flash.go{animation:camflash .4s ease-out}
@keyframes camflash{0%{opacity:.9}100%{opacity:0}}
.readbox{position:relative;overflow:hidden;border-radius:16px;max-width:min(320px,80vw)}
.readbox img{display:block;width:100%;max-height:52vh;object-fit:cover;opacity:.8}
.readbox::after{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:#ffd60a;box-shadow:0 0 18px 4px rgba(255,214,10,.55);animation:scanline 1.6s ease-in-out infinite alternate}
@keyframes scanline{to{top:calc(100% - 3px)}}
.backdrop{position:fixed;inset:0;border:none;border-radius:0;background:none;min-height:0;padding:0}
.sheetcard{position:relative;max-width:520px;width:100%;border-radius:20px}
.qrbox{padding:20px;background:#fff;border-radius:24px;box-shadow:0 20px 50px rgba(8,22,60,.35)}
.qrbox img,.qrbox canvas{display:block;width:240px;height:240px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:14px;max-width:calc(100% - 32px);text-align:center}
.notice{background:var(--accent-soft);color:var(--ink);border-radius:14px;padding:12px 14px;font-size:14px}
.copyrow{display:flex;justify-content:space-between;align-items:center;gap:10px}
/* feedback after a tap: busy → done (green ✓) or error (shake) */
.btn-p,.btn-dark{--spin:var(--on-accent)}
.btn-dark{--spin:var(--bg)}
.is-busy,.is-done{color:transparent!important;pointer-events:none}
.is-busy svg,.is-done svg{visibility:hidden}
.is-busy::after{content:"";position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;border:2.5px solid var(--spin);border-right-color:transparent;animation:spin .7s linear infinite}
.is-done{background:var(--ok)!important;border-color:var(--ok)!important}
.is-done::after{content:"✓\00a0" attr(data-done);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font:700 16px var(--body);white-space:nowrap;animation:pop .32s cubic-bezier(.2,1.4,.4,1)}
.btn-link.is-done,.linkbtn.is-done{background:none!important;border-color:transparent!important}
.btn-link.is-done::after,.linkbtn.is-done::after{color:var(--ok);justify-content:flex-start}
.btn-link.is-busy::after,.linkbtn.is-busy::after{left:12px}
.is-err{animation:shake .36s;border-color:var(--warn)!important}
.bump{animation:bump .3s cubic-bezier(.2,1.4,.4,1)}
.chip.pop{animation:pop .3s cubic-bezier(.2,1.4,.4,1)}

/* screen changes and sheets */
#app.enter .lhead{animation:fade .22s ease both}
#app.enter .lbody>*{animation:viewin .26s cubic-bezier(.2,.8,.2,1) both}
#app.enter .lbody>*:nth-child(2){animation-delay:.025s}
#app.enter .lbody>*:nth-child(3){animation-delay:.05s}
#app.enter .lbody>*:nth-child(4){animation-delay:.075s}
#app.enter .lbody>*:nth-child(n+5){animation-delay:.1s}
.layer.anim{animation:fade .2s ease}
.layer.anim .sheetcard{animation:sheetup .34s cubic-bezier(.2,.8,.2,1)}
.layer.anim .qrbox{animation:pop .4s cubic-bezier(.2,1.3,.4,1)}
.toast{animation:toastin .26s cubic-bezier(.2,.8,.2,1)}

/* loading placeholders */
.skel{gap:10px}
.sk{display:block;height:14px;border-radius:7px;background:linear-gradient(90deg,var(--track) 0%,var(--bg) 50%,var(--track) 100%);background-size:200% 100%;animation:shimmer 1.3s linear infinite}

/* pull to refresh */
#ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:2;width:28px;height:28px;opacity:0;transform:translate(-50%,0);pointer-events:none}
#ptr svg{display:block;transition:transform .2s cubic-bezier(.2,1.4,.4,1)}
#ptr .trk{stroke:var(--track)}
#ptr .arc{stroke:var(--accent)}
#ptr.ready svg{transform:scale(1.12)}
#ptr.spin svg{animation:spin .75s linear infinite}
#ptr.spin .arc{stroke-dashoffset:42!important}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes bump{40%{transform:scale(1.28)}}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
@keyframes viewin{from{opacity:0;transform:translateY(8px)}}
@keyframes fade{from{opacity:0}}

<script>
const API = (window.SPLIT_CONFIG||{}).API_URL || "";
const APP_VERSION = "12"; // verhoog bij elke nieuwe index.html, dan updaten alle toestellen vanzelf

let scriptVer=null, scriptVerBusy=false;
function scriptVersion(){ // versie van je Apps Script, één keer opgehaald
  if(scriptVer===null && !scriptVerBusy && API && !API.startsWith("PLAK")){ scriptVerBusy=true;
    fetch(API).then(r=>r.json()).then(j=>{ scriptVer=String(j.version||""); if(S.view==="profiel") render(); }).catch(()=>{ scriptVer=""; }); }
  return scriptVer||"";
}
/* ---------- automatische update ---------- */
// GitHub laat toestellen een oude kopie tot 10 minuten bewaren. Bij openen kijken we zelf of er een nieuwere versie is.
let updChecking=false;
async function checkUpdate(){
  if(updChecking || !navigator.onLine) return; updChecking=true;
  try{
    const r=await fetch(location.pathname+"?check="+Date.now(), { cache:"no-store" });
    const m=/const APP_VERSION = "([\d.]+)"/.exec(await r.text());
    if(m && m[1]!==APP_VERSION && parseFloat(m[1])>parseFloat(APP_VERSION)){
      let tried=""; try{ tried=sessionStorage.getItem("updTried")||""; }catch{}
      if(tried===m[1]) return; // al eens geprobeerd: geen eindeloze lus
      if(typeof busyEditing==="function" && busyEditing()){ updPending=true; return; } // niet midden in een ticket
      try{ sessionStorage.setItem("updTried", m[1]); }catch{}
      location.replace(location.pathname+"?v="+m[1]+location.hash);
    }
  }catch{} finally{ updChecking=false; }
}
let updPending=false;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur = n => new Intl.NumberFormat("nl-BE",{style:"currency",currency:"EUR"}).format(n||0);
const r2 = n => Math.round((n+Number.EPSILON)*100)/100;
const day = t => new Date(t).toLocaleDateString("nl-BE",{weekday:"short",day:"numeric",month:"short"});
const sum = t => r2((t.items||[]).reduce((s,i)=>s+i.qty*i.unitPrice,0));
const rand = n => Array.from(crypto.getRandomValues(new Uint8Array(n)),b=>b.toString(16).padStart(2,"0")).join("");
const PALETTE = ["#1f5fd1","#b4660f","#1d8a55","#8a3fbf","#c2386a","#0f7f8c"];
const colorFor = id => { let h=0; for (const c of String(id)) h=(h*31+c.charCodeAt(0))>>>0; return PALETTE[h%PALETTE.length]; };
const initials = n => (n||"?").trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase();
const linkFor = (t, pid) => location.origin + location.pathname + "#t=" + t.id + (pid ? "&p=" + pid : "");
const listNames = a => a.length<=1 ? a.join("") : a.slice(0,-1).join(", ") + " en " + a[a.length-1];

const ICON = {
  get:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v11"/><path d="m7.5 9.5 4.5 4.5 4.5-4.5"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>',
  share:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6"/><path d="M9 12h6"/></svg>',
  me:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>',
  cam:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8a2 2 0 0 1 2-2h2l1.5-2h5L16 6h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  up:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 8 5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>',
  qr:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM18 18h3v3h-3z"/></svg>',
  link:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>',
  plus:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M12 8v8M8 12h8"/></svg>',
  check:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>'
};

/* ---------- this device's profile ---------- */
const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch{ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch{} }
};
let me = store.get("me", null);
if(!me){ me = { id:"u"+rand(8), key:rand(16), name:"", bunq:"", iban:"" }; store.set("me", me); }
const codeOf = () => me.id + "." + me.key;
function parseCode(s){ const m=/^(u[0-9a-f]{16})\.([0-9a-f]{32})$/.exec(String(s||"").trim()); return m?{id:m[1],key:m[2]}:null; }

/* ---------- theme ---------- */
const getTheme = () => store.get("theme","light");
function applyTheme(t){ if(t==="auto") delete document.documentElement.dataset.app; else document.documentElement.dataset.app=t; }
applyTheme(getTheme());

/* ---------- home screen ---------- */
let installEvt = null;
window.addEventListener("beforeinstallprompt", e=>{ e.preventDefault(); installEvt=e; if(S.view==="profiel") render(); });
const standalone = () => { try{ return matchMedia("(display-mode: standalone)").matches || navigator.standalone===true; }catch{ return false; } };
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);

/* ---------- server ---------- */
async function api(action, data={}, ident){
  if(!API || API.startsWith("PLAK")) throw new Error("De app is nog niet gekoppeld aan je Google Sheet. Vul je Apps Script-link in config.js in.");
  const who = ident || me;
  const res = await fetch(API, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" },
    body: JSON.stringify({ action, userId:who.id, userKey:who.key, name: ident ? "" : me.name, ...data }) });
  const j = await res.json();
  if(j.error) throw new Error(j.error);
  return j;
}
async function importCode(code){
  const c = parseCode(code);
  if(!c) throw new Error("Deze code klopt niet. Kopieer ze opnieuw onder Profiel op je andere toestel.");
  const r = await api("me", {}, c);
  me = { id:c.id, key:c.key, name:r.name||"", bunq:r.bunq||"", iban:r.iban||"" };
  store.set("me", me);
}

/* ---------- state ---------- */
let home = { mine:[], shares:[], ai:false }, loaded=false, loadErr="";
const cache = {};
const S = { filter: (()=>{ try{ return store.get("filter","open"); }catch{ return "open"; } })(), view:"krijgen", id:null, draft:null, mine:null, mineBase:null, pid:null, pidHint:null, joining:false, namesOpen:-1,
  justMade:null, layer:null, confirmDel:false, err:"", photo:null, pasted:"", showImport:false };

async function refresh(){
  if(!me.name) return;
  try{ home = await api("home"); loaded=true; loadErr=""; }
  catch(e){ loadErr = e.message; }
  render();
}
async function loadTicket(id){
  try{ cache[id] = await api("getTicket",{ id }); }
  catch(e){ cache[id] = { error:e.message }; }
  render(); return cache[id];
}
const busyEditing = () => !!S.draft || (S.layer && (S.layer.kind==="pick" || S.layer.kind==="propose"));
setInterval(()=>{ if(document.visibilityState==="visible" && !busyEditing()){ refresh(); if(S.view==="select"&&S.id&&!saving) loadTicket(S.id); } }, 20000);
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible"){ checkUpdate(); if(!busyEditing()) refresh(); } });

/* ===== Splitticket rekenregels (identiek in app en script) =====
 * Lijnen "voor iedereen" (all): verplicht, gelijk verdeeld over de hele groep (groep + betaler).
 * Andere lijnen: ieder kiest zelf een deel { n: aantal, w: gedeeld met }. Deel = n ÷ w stuks.
 * De betaler stelt voor wie hij verwacht (proposal); zijn eigen keuze staat onder sleutel "o".
 * Wie betaalde, houdt het bedrag "voor iedereen" van op dat moment (paidAllPP).
 */
function calcTicket(t, claims) {
  const R = n => Math.round((n + Number.EPSILON) * 100) / 100;
  const share = p => (p && Number(p.w) > 0 ? Math.max(0, Number(p.n) || 0) / Number(p.w) : 0);
  const items = t.items || [], people = t.people || [], prop = t.proposal || {};
  claims = claims || [];
  const group = people.length + 1;
  const allTotal = items.reduce((s, it) => s + (it.all ? it.qty * it.unitPrice : 0), 0);
  const allPP = allTotal / group;
  const ownerPicks = {};
  items.forEach((it, i) => { const o = (prop[i] || {}).o; if (o && !it.all && share(o) > 0) ownerPicks[i] = o; });
  const lines = picks => items.reduce((s, it, i) => s + (it.all ? 0 : share((picks || {})[i]) * it.unitPrice), 0);
  const used = items.map((it, i) => it.all ? 0 : share(ownerPicks[i]) + claims.reduce((s, c) => s + share((c.picks || {})[i]), 0));
  const party = c => {
    const paid = Number(c.paidTotal) || 0;
    const frozen = paid > 0 && c.paidAllPP !== null && c.paidAllPP !== undefined && c.paidAllPP !== "";
    const pp = frozen ? Number(c.paidAllPP) : allPP;
    const total = R(pp + lines(c.picks));
    return { total: total, paid: R(paid), due: R(total - paid), over: frozen ? R(pp - allPP) : 0, linesAmt: R(lines(c.picks)) };
  };
  const proposedFor = key => {
    const out = {};
    items.forEach((it, i) => { const x = (prop[i] || {})[key]; if (x && !it.all && share(x) > 0) out[i] = x; });
    return out;
  };
  const unclaimed = R(items.reduce((s, it, i) => s + (it.all ? 0 : Math.max(0, it.qty - used[i]) * it.unitPrice), 0));
  return { group: group, allTotal: R(allTotal), allPP: R(allPP), allPPexact: allPP, used: used, ownerPicks: ownerPicks,
    owner: R(allPP + lines(ownerPicks)), party: party, proposedFor: proposedFor, unclaimed: unclaimed, share: share, lines: lines, R: R };
}
/* ===== einde rekenregels ===== */


/* ---------- money helpers ---------- */
const R = n => Math.round((n+Number.EPSILON)*100)/100;
function myTicket(id){ return home.mine.find(t=>t.id===id) || null; }
const lineTotal = it => R(it.qty*it.unitPrice);
const money = x => x ? (Math.round(x*100)/100).toFixed(2).replace(".",",") : "";
const shareOf = p => p && p.w>0 ? p.n/p.w : 0;
const fmtShare = p => !p ? "" : p.w===1 ? `${p.n}` : `${p.n}÷${p.w}`;
const nonAll = t => (t.items||[]).map((it,i)=>({it,i})).filter(x=>!x.it.all);
const allLines = t => (t.items||[]).map((it,i)=>({it,i})).filter(x=>x.it.all);
function personName(t, c){ return ((t.people||[]).find(p=>p.pid===c.pid)||{}).name || c.name; }

// Iedereen van de groep met zijn stand: betaald, gekozen, of nog niets.
function rowsOf(t){
  const c=calcTicket(t, t.claims||[]), claims=t.claims||[], people=t.people||[];
  const rows=people.map(p=>{
    const cl=claims.find(x=>x.pid===p.pid)||null, pr=cl?c.party(cl):null;
    const paid = (pr && pr.paid>0 && pr.due<=0.009) || (!!p.paid && !(pr&&pr.paid>0));
    const total = pr ? pr.total : R(c.allPPexact + c.lines(c.proposedFor(p.pid)));
    return { key:"p-"+p.pid, pid:p.pid, name:p.name, claim:cl, manual:!!p.paid && !(pr&&pr.paid>0), joined:!!p.joined, ack:!!p.ack,
      paid, paidAmt: pr?pr.paid:0, due: pr?Math.max(0,pr.due):(p.paid?0:R(c.allPPexact)), total, chose:!!cl, over: pr?pr.over:0, declined: cl?(cl.declined||{}):{} };
  });
  claims.filter(cl=>!cl.pid || !people.some(p=>p.pid===cl.pid)).forEach(cl=>{
    const pr=c.party(cl); if(!pr.paid && !Object.keys(cl.picks||{}).length) return; // vrijgemaakt of nog niets gekozen
    rows.push({ key:"u-"+cl.userId, pid:null, name:cl.name, claim:cl, manual:false, joined:false, ack:true,
      paid: pr.paid>0 && pr.due<=0.009, paidAmt:pr.paid, due:Math.max(0,pr.due), total:pr.total, chose:true, over:pr.over, declined:cl.declined||{} });
  });
  return rows;
}
function standOf(t){
  const c=calcTicket(t, t.claims||[]), rows=rowsOf(t), total=sum(t), own=c.owner;
  const received=R(rows.reduce((s,r)=>s+(r.manual? r.total : r.paidAmt),0));
  const toPay=R(rows.reduce((s,r)=>s+(r.manual?0:r.due),0));
  const open=Math.max(0,R(total-own-received));
  const gap=R(total-own-received-toPay); // >0 tekort, <0 te veel, als iedereen betaalt wat hij nu koos
  return { c, rows, total, own, received, toPay, unclaimed:c.unclaimed, open, gap };
}

async function shrinkPhoto(file, max=1800, quality=0.82){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((ok,fail)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=()=>fail(new Error("De foto kon niet geopend worden.")); i.src=url; });
    const s=Math.min(1, max/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement("canvas"); c.width=Math.round(img.naturalWidth*s); c.height=Math.round(img.naturalHeight*s);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    return c.toDataURL("image/jpeg",quality).split(",")[1];
  } finally { URL.revokeObjectURL(url); }
}

function render(){
  const v=S.view;
  if(!me.name){ $("app").innerHTML=viewOnboard(); $("tabbar").innerHTML=""; $("layer").innerHTML=""; return; }
  if(["group","new","propose"].includes(v) && !S.draft) S.view = S.id ? "ticket" : "krijgen";
  const vv=S.view;
  const html = vv==="krijgen"?viewKrijgen(): vv==="delen"?viewDelen(): vv==="profiel"?viewProfiel(): vv==="ticket"?viewTicket(): vv==="select"?viewSelect(): vv==="scan"?viewScan(): vv==="group"?viewGroup(): vv==="propose"?viewPropose(): viewNew();
  const focused = document.activeElement && document.activeElement.id;
  const app=$("app");
  const cut = html.indexOf("<!--head-->");
  app.innerHTML = cut<0 ? `<div class="lbody">${html}</div>` : `<div class="lhead">${html.slice(0,cut)}</div><div class="lbody">${html.slice(cut+11)}</div>`;
  S.popPid = null;
  if(vv!==lastView){ if(lastView && DETAIL.includes(vv) && !NAV) pushLevel(); NAV=""; lastView=vv; app.classList.remove("enter"); void app.offsetWidth; app.classList.add("enter"); clearTimeout(enterT); enterT=setTimeout(()=>app.classList.remove("enter"),420); }
  if(focused && $(focused) && /INPUT|TEXTAREA/.test($(focused).tagName)) $(focused).focus();
  renderBar(); renderLayer(); applyFlash(); syncTopTitle();
  if(updPending && !busyEditing()){ updPending=false; checkUpdate(); }
  if(bumpSel){ document.querySelectorAll(bumpSel).forEach(x=>{ x.classList.remove("bump"); void x.offsetWidth; x.classList.add("bump"); }); bumpSel=null; }
}

/* ---------- haptic ---------- */
// Android: trillen. iPhone (iOS 18+): Safari geeft een tik als een schakelaar omspringt; die gebruiken we onzichtbaar.
function haptic(){
  try{ if(typeof navigator.vibrate==="function"){ navigator.vibrate(12); return; } }catch{}
  try{
    const l=document.createElement("label"), i=document.createElement("input");
    i.type="checkbox"; i.setAttribute("switch",""); l.setAttribute("aria-hidden","true");
    l.style.cssText="position:fixed;opacity:0;pointer-events:none;left:-99px"; l.appendChild(i); document.body.appendChild(l);
    l.click(); setTimeout(()=>l.remove(),50);
  }catch{}
}

/* ---------- live camera: QR-codes en tickets ---------- */
const CAM = { stream:null, track:null, raf:0, last:0, found:false, torch:false, canvas:null, ctx:null, wrongAt:0, hintT:0 };
const CAM_HINT = "Richt op een ticket of een QR-code";
let jsqrLoading=null;
function loadJsQR(){
  if(window.jsQR) return Promise.resolve();
  return jsqrLoading ||= new Promise((ok,fail)=>{ const s=document.createElement("script"); s.src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"; s.onload=ok; s.onerror=fail; document.head.appendChild(s); });
}
function camHint(text, good){ const h=$("camHint"); h.textContent=text; h.classList.toggle("good", !!good); }
function camReset(){
  const st=$("camStage"), fr=$("camFrame");
  st.style.transition="none"; st.style.transform=""; void st.offsetWidth; st.style.transition="";
  fr.removeAttribute("style"); fr.classList.remove("found"); camHint(CAM_HINT);
}
async function openCamera(){
  if(!navigator.mediaDevices?.getUserMedia){ $("cam").value=""; $("cam").click(); return; } // oude browsers: gewone foto-camera
  const box=$("camera"); box.hidden=false; document.body.classList.add("cam-open"); camReset(); CAM.found=false;
  loadJsQR().catch(()=>{});
  try{
    CAM.stream = await navigator.mediaDevices.getUserMedia({ audio:false, video:{ facingMode:{ ideal:"environment" }, width:{ ideal:1920 }, height:{ ideal:1080 } } });
    if(box.hidden){ CAM.stream.getTracks().forEach(t=>t.stop()); return; }
    const v=$("camVideo"); v.srcObject=CAM.stream; await v.play().catch(()=>{});
    CAM.track=CAM.stream.getVideoTracks()[0];
    const caps=CAM.track.getCapabilities?.()||{}; $("camTorch").hidden=!caps.torch; $("camSpacer").hidden=!!caps.torch;
    cancelAnimationFrame(CAM.raf); CAM.raf=requestAnimationFrame(camLoop);
  }catch(e){
    camHint("Geen toegang tot de camera. Sta het toe in je instellingen, of kies een foto.");
  }
}
function closeCamera(){
  cancelAnimationFrame(CAM.raf);
  CAM.stream?.getTracks().forEach(t=>t.stop()); CAM.stream=null; CAM.track=null; CAM.torch=false;
  $("camVideo").srcObject=null; $("camera").hidden=true; document.body.classList.remove("cam-open");
}
function camLoop(now){
  CAM.raf=requestAnimationFrame(camLoop);
  if(CAM.found || now-CAM.last<130) return;
  CAM.last=now;
  const v=$("camVideo"); if(!v.videoWidth || !window.jsQR) return;
  const k=Math.min(1, 720/Math.max(v.videoWidth,v.videoHeight)), w=Math.round(v.videoWidth*k), h=Math.round(v.videoHeight*k);
  if(!CAM.canvas){ CAM.canvas=document.createElement("canvas"); CAM.ctx=CAM.canvas.getContext("2d",{ willReadFrequently:true }); }
  if(CAM.canvas.width!==w||CAM.canvas.height!==h){ CAM.canvas.width=w; CAM.canvas.height=h; }
  CAM.ctx.drawImage(v,0,0,w,h);
  const code=jsQR(CAM.ctx.getImageData(0,0,w,h).data, w, h, { inversionAttempts:"dontInvert" });
  if(code && code.data) onQR(code, k);
}
function onQR(code, k){
  const m=/#t=([a-z0-9]+)(?:&p=([a-z0-9]+))?/i.exec(code.data);
  if(!m){
    if(Date.now()-CAM.wrongAt>2500){ CAM.wrongAt=Date.now(); haptic(); camHint("Dit is geen Splitticket-code"); clearTimeout(CAM.hintT); CAM.hintT=setTimeout(()=>{ if(!CAM.found) camHint(CAM_HINT); },1800); }
    return;
  }
  CAM.found=true;
  // QR-hoeken van videobeeld naar schermcoördinaten (video staat in "cover")
  const v=$("camVideo"), st=$("camStage"), cw=st.clientWidth, ch=st.clientHeight;
  const s=Math.max(cw/v.videoWidth, ch/v.videoHeight), ox=(cw-v.videoWidth*s)/2, oy=(ch-v.videoHeight*s)/2;
  const L=code.location, pts=[L.topLeftCorner,L.topRightCorner,L.bottomLeftCorner,L.bottomRightCorner].map(p=>({ x:p.x/k*s+ox, y:p.y/k*s+oy }));
  const pad=10, x0=Math.min(...pts.map(p=>p.x))-pad, x1=Math.max(...pts.map(p=>p.x))+pad, y0=Math.min(...pts.map(p=>p.y))-pad, y1=Math.max(...pts.map(p=>p.y))+pad;
  const fr=$("camFrame");
  fr.classList.add("found");
  Object.assign(fr.style,{ left:x0+"px", top:y0+"px", width:(x1-x0)+"px", height:(y1-y0)+"px" });
  // inzoomen: de code naar het midden en groter
  const cx=(x0+x1)/2, cy=(y0+y1)/2, z=Math.max(1.25, Math.min(2.8, (cw*0.62)/(x1-x0)));
  // zo dicht mogelijk naar het midden, zonder dat er een zwarte rand verschijnt
  const clamp=(t,c,size)=>Math.max(size-c-(size-c)*z, Math.min(c*z-c, t));
  const tx=clamp(cw/2-cx, cx, cw), ty=clamp(ch/2-cy, cy, ch);
  st.style.transformOrigin=`${cx}px ${cy}px`;
  st.style.transform=`translate(${tx}px, ${ty}px) scale(${z})`;
  haptic(); camHint("Ticket gevonden", true);
  const id=m[1], p=m[2]||"";
  setTimeout(()=>{
    closeCamera();
    try{ history.replaceState(null,"",location.pathname+location.search+"#t="+id+(p?"&p="+p:"")); }catch{}
    readHash();
  }, 750);
}
async function camShoot(){
  const v=$("camVideo"); if(!v.videoWidth) return;
  const fl=$("camFlash"); fl.classList.remove("go"); void fl.offsetWidth; fl.classList.add("go"); haptic();
  const c=document.createElement("canvas"); c.width=v.videoWidth; c.height=v.videoHeight; c.getContext("2d").drawImage(v,0,0);
  const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",0.9));
  setTimeout(()=>{ closeCamera(); usePhoto(new File([blob],"ticket.jpg",{ type:"image/jpeg" })); }, 220);
}

const edgeSwipeOn = () => isIOS && standalone();

const SW = { x0:null, y0:0, on:false, dx:0, t0:0 };
function swipeTargets(){

}
function setSwipe(x, mode){

  swipeTargets().forEach(el=>{ el.style.transition=ease; el.style.transform = x ? `translateX(${x}px)` : ""; });

}
document.addEventListener("touchstart", e=>{

},{ passive:true });
document.addEventListener("touchmove", e=>{
  if(SW.x0===null) return;
  const t=e.touches[0], dx=t.clientX-SW.x0, dy=t.clientY-SW.y0;
  if(!SW.on){
    if(Math.abs(dy)>12 && Math.abs(dy)>dx){ SW.x0=null; return; }
    if(dx<8) return;
    SW.on=true;
  }
  e.preventDefault();
  SW.dx=Math.max(0,dx); setSwipe(SW.dx,"drag");
},{ passive:false });
document.addEventListener("touchend", ()=>{
  if(SW.x0===null) return;
  SW.x0=null; if(!SW.on) return; SW.on=false;
  const speed = SW.dx / Math.max(1, performance.now()-SW.t0);
  if(SW.dx > innerWidth*0.33 || (speed>0.5 && SW.dx>40)){
    setSwipe(innerWidth,"out"); haptic();
    setTimeout(()=>{ setSwipe(0,"reset"); navBack(); }, 240);
  } else setSwipe(0,"back");
});
document.addEventListener("touchcancel", ()=>{ if(SW.on){ SW.x0=null; SW.on=false; setSwipe(0,"back"); } });
function syncTopTitle(){ // titel in de balk bovenaan zodra de grote titel eronder verdwijnt
  const tt=document.querySelector(".toptitle"); if(!tt) return;
  const h=document.querySelector(".lbody h1"), head=document.querySelector(".lhead");
  tt.classList.toggle("on", !!(h && head && h.getBoundingClientRect().bottom < head.getBoundingClientRect().bottom));
}
addEventListener("scroll", ()=>{ document.body.classList.toggle("scrolled", scrollY>4); syncTopTitle(); }, { passive:true });

/* ---------- pull to refresh ---------- */
const PTR = { y0:null, x0:0, dy:0, on:false, busy:false, ready:false };
const PTR_GO = 62, PTR_MAX = 100, PTR_HOLD = 52;
const ptrAllowed = () => me.name && !S.layer && $("camera").hidden && (S.view==="krijgen" || S.view==="delen" || S.view==="ticket");
function setPull(y, mode){ // mode: "drag" | "spin" | "back"
  const app=$("app").querySelector(".lbody")||$("app"), el=$("ptr"), arc=el.querySelector(".arc");
  const hb=$("app").querySelector(".lhead")?.getBoundingClientRect().bottom || 0;
  el.style.top = (hb+8)+"px";
  const ease = mode==="drag" ? "none" : "transform .34s cubic-bezier(.2,.8,.2,1)";
  app.style.transition = ease;
  app.style.transform = y ? `translateY(${y}px)` : "";
  const p = Math.min(1, y/PTR_GO);
  el.style.transition = mode==="drag" ? "none" : "opacity .25s, transform .34s cubic-bezier(.2,.8,.2,1)";
  el.style.opacity = mode==="back" ? 0 : (y ? Math.max(.2,p) : 0);
  el.style.transform = `translate(-50%, ${Math.max(0, y*0.5-16)}px)`;
  el.classList.toggle("spin", mode==="spin");
  el.classList.toggle("ready", mode==="drag" && p>=1);
  if(mode!=="spin") arc.style.strokeDashoffset = String(62.83*(1-p*0.82));
}
document.addEventListener("touchstart", e=>{
  if(PTR.busy || !ptrAllowed() || window.scrollY>0 || e.touches.length!==1) return;
  if(e.target.closest("input,textarea")) return;
  if(edgeSwipeOn() && e.touches[0].clientX<26) return;
  PTR.y0=e.touches[0].clientY; PTR.x0=e.touches[0].clientX; PTR.dy=0; PTR.on=false; PTR.ready=false;
},{ passive:true });
document.addEventListener("touchmove", e=>{
  if(PTR.y0===null) return;
  const dy=e.touches[0].clientY-PTR.y0, dx=Math.abs(e.touches[0].clientX-PTR.x0);
  if(!PTR.on && (dy<6 || dx>dy)){ if(dy<0||dx>dy) PTR.y0=null; return; }
  if(window.scrollY>0){ PTR.y0=null; return; }
  PTR.on=true; e.preventDefault();
  const raw = Math.max(0,dy)*0.55; PTR.dy = raw<PTR_GO ? raw : Math.min(PTR_MAX, PTR_GO + (raw-PTR_GO)*0.35); // na de drempel: zwaarder
  const ready = PTR.dy>=PTR_GO;
  if(ready && !PTR.ready){ haptic(); }
  PTR.ready = ready;
  setPull(PTR.dy, "drag");
},{ passive:false });
document.addEventListener("touchend", async ()=>{
  if(PTR.y0===null) return;
  PTR.y0=null; if(!PTR.on) return; PTR.on=false;
  if(PTR.ready){
    PTR.busy=true; setPull(PTR_HOLD, "spin");
    const t0=Date.now();
    await refresh();
    if(S.view==="ticket" && S.id) render();
    await wait(Math.max(0, 750-(Date.now()-t0)));
    PTR.busy=false;
    if(loadErr) toast("Bijwerken lukte niet. Controleer je verbinding.");
  }
  setPull(0, "back");
});
document.addEventListener("touchcancel", ()=>{ if(PTR.on && !PTR.busy){ PTR.y0=null; PTR.on=false; setPull(0,"back"); } });

/* ---------- boot ---------- */
(async()=>{
  const km=/^#koppel=(.+)$/.exec(location.hash||"");
  if(km){
    const c=parseCode(decodeURIComponent(km[1]));
    if(c && c.id!==me.id && !me.name){ try{ await importCode(c.id+"."+c.key); }catch{} }
    clearHash();
  }
  render();
  checkUpdate();
  if(me.name){ await refresh(); readHash(); }
})();
</script>
</body>
