<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Splitticket">
<meta name="theme-color" content="#eef1f6">
<title>Splitticket</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#eef1f6; --card:#ffffff; --line:#dde3eb; --divider:#e6ebf1; --track:#e4e9f0;
  --ink:#14202b; --muted:#5d6874; --accent:#1f5fd1; --accent-soft:rgba(31,95,209,.12); --on-accent:#ffffff;
  --ok:#1d8a55; --warn:#b4660f; --av-off:#a7b1bd; --seg:#dfe5ed; --seg-on:#ffffff;
  --glass:rgba(255,255,255,.58); --glass-line:rgba(255,255,255,.75); --glass-shadow:0 10px 30px rgba(20,32,50,.16), inset 0 1px 0 rgba(255,255,255,.95);
  --qr-bg:#1f5fd1; --dim:rgba(8,14,22,.5);
  --display:"Bricolage Grotesque",-apple-system,system-ui,sans-serif;
  --body:-apple-system,"SF Pro Text",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-app="light"]){
  --bg:#0d1217; --card:#171f28; --line:#26323f; --divider:#26323f; --track:#26323f;
  --ink:#e7edf2; --muted:#9aa7b4; --accent:#8fb2ff; --accent-soft:rgba(143,178,255,.16); --on-accent:#0d1217;
  --ok:#4cc38a; --warn:#f0a54a; --av-off:#4a5664; --seg:#1f2a35; --seg-on:#3a4757;
  --glass:rgba(36,46,58,.62); --glass-line:rgba(255,255,255,.12); --glass-shadow:0 10px 30px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.12);
  --qr-bg:#1b3f86; --dim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-app="dark"]{
  --bg:#0d1217; --card:#171f28; --line:#26323f; --divider:#26323f; --track:#26323f;
  --ink:#e7edf2; --muted:#9aa7b4; --accent:#8fb2ff; --accent-soft:rgba(143,178,255,.16); --on-accent:#0d1217;
  --ok:#4cc38a; --warn:#f0a54a; --av-off:#4a5664; --seg:#1f2a35; --seg-on:#3a4757;
  --glass:rgba(36,46,58,.62); --glass-line:rgba(255,255,255,.12); --glass-shadow:0 10px 30px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.12);
  --qr-bg:#1b3f86; --dim:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
body{overscroll-behavior-y:none}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 var(--body);
  padding:calc(20px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(130px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#app{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font:800 34px/1.05 var(--display);letter-spacing:-.02em;text-wrap:balance}
.lead{margin:0;font-size:15px;color:var(--muted)}
.lead b{color:var(--ink);font-family:var(--mono)}
.head{display:flex;flex-direction:column;gap:4px;padding:0 4px}
.cap{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.tap{cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .12s ease}
.tap:active{transform:scale(.985)}
.tap:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.col{display:flex;flex-direction:column;gap:2px;min-width:0}
.right{align-items:flex-end;text-align:right}
.t1{font-size:17px;font-weight:600}
.t2{font-size:13px;color:var(--muted)}
.amt{font:600 17px var(--mono)}
.bar{height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.bar>span{display:block;height:100%;border-radius:3px;background:var(--accent)}
.bar>span.full{background:var(--ok)}
.avs{display:flex}
.av{width:28px;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;border:2px solid var(--card);flex:none}
.avs .av+.av{margin-left:-8px}
.av.off{background:var(--av-off)}
.av.big{width:44px;height:44px;border-radius:22px;font-size:15px;border:none}
.av.mid{width:36px;height:36px;border-radius:18px;font-size:13px;border:none}
.foot{display:flex;align-items:center;gap:10px;border-top:1px solid var(--divider);padding-top:12px}
.foot .t2{flex:1;min-width:0}
button,.btn{--spin:var(--accent);position:relative;font:600 15px var(--body);border-radius:22px;min-height:44px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-decoration:none;border:1px solid var(--line);background:var(--card);color:var(--ink);-webkit-tap-highlight-color:transparent;
  transition:transform .14s cubic-bezier(.2,.8,.2,1),background-color .22s,border-color .22s,color .22s,filter .14s,opacity .2s}
button:active:not(:disabled),.btn:active{transform:scale(.96);filter:brightness(.9)}
.tab:active:not(:disabled){transform:scale(.93)}
.cam:active{transform:scale(.9)}
.step button:active:not(:disabled){transform:scale(.86)}
button:focus-visible,.btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.5}
.btn-p{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn-dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn-soft{background:var(--accent-soft);border-color:transparent;color:var(--accent);min-height:40px;flex:none}
.btn-link{border:none;background:none;color:var(--accent);padding:0 4px;min-height:44px;font-size:17px;font-weight:400}
.linkbtn{border:none;background:none;padding:4px 0;min-height:0;color:var(--accent);font-size:13px;font-weight:600;align-self:flex-start}
.btn-big{height:64px;border-radius:16px;font-size:17px}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pill{align-self:flex-start;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;border:1px solid currentColor;flex:none}
.ok{color:var(--ok)} .warn{color:var(--warn)}
.list{padding:4px 16px;gap:0}
.line{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0}
.line+.line{border-top:1px dashed var(--line)}
.line .name{font-size:16px;font-weight:600}
.line.mine .name{color:var(--accent)}
.line.gone{opacity:.5}
.step{display:flex;align-items:center;gap:8px}
.step button{width:40px;height:40px;min-height:40px;padding:0;border-radius:20px;font-size:20px;background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.step button:disabled{opacity:.35}
.step .q{min-width:20px;text-align:center;font:600 17px var(--mono)}
.person{display:flex;align-items:center;gap:12px;padding:12px 0}
.person+.person{border-top:1px solid var(--divider)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:38px;border-radius:19px;padding:0 14px;font-size:15px;font-weight:600;border:1px solid transparent;background:var(--accent-soft);color:var(--accent);display:inline-flex;align-items:center;gap:4px}
.chip.sug{background:var(--seg);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.chip .x{width:28px;height:28px;min-height:0;padding:0;margin-right:-8px;border:none;border-radius:14px;background:none;color:inherit;font-size:18px}
.empty{padding:28px 20px;text-align:center;align-items:center}
.empty p{margin:0;color:var(--muted);max-width:30ch}
.topbar{display:flex;justify-content:space-between;align-items:center;margin:-8px 0 -4px}
.status{font-size:13px;font-weight:600;color:var(--ok)}
.edit{display:grid;grid-template-columns:minmax(0,1fr) 3.6rem 5.2rem 2.6rem;gap:6px;align-items:center}
input,textarea{font:16px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;min-width:0}
textarea{min-height:120px;resize:vertical}
input.n{font-family:var(--mono);text-align:right}
.edit .x{width:2.6rem;height:2.6rem;min-height:0;padding:0;border-radius:50%}
.field{display:flex;flex-direction:column;gap:6px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;border-radius:14px;background:var(--seg)}
.seg button{border:none;background:none;border-radius:10px;min-height:40px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--seg-on);color:var(--ink);box-shadow:0 1px 3px rgba(20,32,50,.12)}
.stat .v{font:600 22px var(--mono)}
.photo{width:100%;border-radius:12px;display:block}
.how{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;color:var(--muted);font-size:14px}
.code{font:500 12px var(--mono);color:var(--muted);word-break:break-all;background:var(--bg);border-radius:10px;padding:10px}
.isteps{display:flex;flex-direction:column;gap:14px}
.istep{display:flex;gap:12px;align-items:flex-start}
.istep .ic{width:40px;height:40px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent)}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:5;pointer-events:none;
  padding:0 max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabbar .in{max-width:520px;margin:0 auto;display:flex;gap:12px;align-items:center;pointer-events:auto}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(1.8);backdrop-filter:blur(20px) saturate(1.8);border:1px solid var(--glass-line);box-shadow:var(--glass-shadow)}
.tabs{flex:1;height:64px;border-radius:32px;display:flex;align-items:center;padding:4px;gap:2px}
.tab{flex:1;height:56px;min-height:0;border-radius:28px;border:none;background:none;flex-direction:column;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:0}
.tab[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.cam{width:64px;height:64px;min-height:0;padding:0;border-radius:32px;background:var(--accent);color:var(--on-accent);border:1px solid var(--glass-line);box-shadow:0 10px 30px rgba(31,95,209,.35),inset 0 1px 0 rgba(255,255,255,.45);flex:none}
.paybar{flex:1;border-radius:32px;padding:10px 10px 10px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.paybar .v{font:600 24px var(--mono)}
.paybar .btn{height:52px;border-radius:26px;font-size:17px}

.layer{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;gap:22px;overflow:auto;
  padding:calc(20px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.layer.qr{background:var(--qr-bg);color:#fff}
.layer.qr .btn-link{color:#fff}
.layer.sheet{background:var(--bg);justify-content:center}
.layer.dim{background:var(--dim);justify-content:flex-end}
.layer.read{background:#101418;color:#fff;justify-content:center}
.readbox{position:relative;overflow:hidden;border-radius:16px;max-width:min(320px,80vw)}
.readbox img{display:block;width:100%;max-height:52vh;object-fit:cover;opacity:.8}
.readbox::after{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:#ffd60a;box-shadow:0 0 18px 4px rgba(255,214,10,.55);animation:scanline 1.6s ease-in-out infinite alternate}
@keyframes scanline{to{top:calc(100% - 3px)}}
.backdrop{position:fixed;inset:0;border:none;border-radius:0;background:none;min-height:0;padding:0}
.sheetcard{position:relative;max-width:520px;width:100%;border-radius:20px}
.qrbox{padding:20px;background:#fff;border-radius:24px;box-shadow:0 20px 50px rgba(8,22,60,.35)}
.qrbox img,.qrbox canvas{display:block;width:240px;height:240px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:14px;max-width:calc(100% - 32px);text-align:center}
.notice{background:var(--accent-soft);color:var(--ink);border-radius:14px;padding:12px 14px;font-size:14px}
.copyrow{display:flex;justify-content:space-between;align-items:center;gap:10px}
/* feedback after a tap: busy → done (green ✓) or error (shake) */
.btn-p,.btn-dark{--spin:var(--on-accent)}
.btn-dark{--spin:var(--bg)}
.is-busy,.is-done{color:transparent!important;pointer-events:none}
.is-busy svg,.is-done svg{visibility:hidden}
.is-busy::after{content:"";position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;border:2.5px solid var(--spin);border-right-color:transparent;animation:spin .7s linear infinite}
.is-done{background:var(--ok)!important;border-color:var(--ok)!important}
.is-done::after{content:"✓\00a0" attr(data-done);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font:700 16px var(--body);white-space:nowrap;animation:pop .32s cubic-bezier(.2,1.4,.4,1)}
.btn-link.is-done,.linkbtn.is-done{background:none!important;border-color:transparent!important}
.btn-link.is-done::after,.linkbtn.is-done::after{color:var(--ok);justify-content:flex-start}
.btn-link.is-busy::after,.linkbtn.is-busy::after{left:12px}
.is-err{animation:shake .36s;border-color:var(--warn)!important}
.bump{animation:bump .3s cubic-bezier(.2,1.4,.4,1)}
.chip.pop{animation:pop .3s cubic-bezier(.2,1.4,.4,1)}

/* screen changes and sheets */
#app.enter>*{animation:viewin .26s cubic-bezier(.2,.8,.2,1) both}
#app.enter>*:nth-child(2){animation-delay:.025s}
#app.enter>*:nth-child(3){animation-delay:.05s}
#app.enter>*:nth-child(4){animation-delay:.075s}
#app.enter>*:nth-child(n+5){animation-delay:.1s}
.layer.anim{animation:fade .2s ease}
.layer.anim .sheetcard{animation:sheetup .34s cubic-bezier(.2,.8,.2,1)}
.layer.anim .qrbox{animation:pop .4s cubic-bezier(.2,1.3,.4,1)}
.toast{animation:toastin .26s cubic-bezier(.2,.8,.2,1)}

/* loading placeholders */
.skel{gap:10px}
.sk{display:block;height:14px;border-radius:7px;background:linear-gradient(90deg,var(--track) 0%,var(--bg) 50%,var(--track) 100%);background-size:200% 100%;animation:shimmer 1.3s linear infinite}

/* pull to refresh */
#ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:4;width:28px;height:28px;opacity:0;transform:translate(-50%,0);pointer-events:none}
#ptr svg{display:block;transition:transform .2s cubic-bezier(.2,1.4,.4,1)}
#ptr .trk{stroke:var(--track)}
#ptr .arc{stroke:var(--accent)}
#ptr.ready svg{transform:scale(1.12)}
#ptr.spin svg{animation:spin .75s linear infinite}
#ptr.spin .arc{stroke-dashoffset:42!important}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes bump{40%{transform:scale(1.28)}}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
@keyframes viewin{from{opacity:0;transform:translateY(8px)}}
@keyframes fade{from{opacity:0}}
@keyframes sheetup{from{transform:translateY(40px);opacity:0}}
@keyframes toastin{from{transform:translate(-50%,12px);opacity:0}}
@keyframes shimmer{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .tap:active,button:active,.btn:active{transform:none!important}
  #ptr.spin svg,.is-busy::after,.sk{animation:none}
}
</style>
</head>
<body>
<div id="ptr" aria-hidden="true"><svg width="28" height="28" viewBox="0 0 28 28"><circle class="trk" cx="14" cy="14" r="10" fill="none" stroke-width="2.5"/><circle class="arc" cx="14" cy="14" r="10" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="62.83" stroke-dashoffset="62.83" transform="rotate(-90 14 14)"/></svg></div>
<div id="app"><div class="card empty"><p>Splitticket laden…</p></div></div>
<div class="tabbar" id="tabbar"></div>
<div id="layer"></div>
<div class="toast" id="toast" hidden></div>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>

<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="parser.js"></script>
<script>
const API = (window.SPLIT_CONFIG||{}).API_URL || "";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur = n => new Intl.NumberFormat("nl-BE",{style:"currency",currency:"EUR"}).format(n||0);
const r2 = n => Math.round((n+Number.EPSILON)*100)/100;
const day = t => new Date(t).toLocaleDateString("nl-BE",{weekday:"short",day:"numeric",month:"short"});
const sum = t => r2((t.items||[]).reduce((s,i)=>s+i.qty*i.unitPrice,0));
const rand = n => Array.from(crypto.getRandomValues(new Uint8Array(n)),b=>b.toString(16).padStart(2,"0")).join("");
const PALETTE = ["#1f5fd1","#b4660f","#1d8a55","#8a3fbf","#c2386a","#0f7f8c"];
const colorFor = id => { let h=0; for (const c of String(id)) h=(h*31+c.charCodeAt(0))>>>0; return PALETTE[h%PALETTE.length]; };
const initials = n => (n||"?").trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase();
const linkFor = (t, pid) => location.origin + location.pathname + "#t=" + t.id + (pid ? "&p=" + pid : "");
const listNames = a => a.length<=1 ? a.join("") : a.slice(0,-1).join(", ") + " en " + a[a.length-1];

const ICON = {
  get:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v11"/><path d="m7.5 9.5 4.5 4.5 4.5-4.5"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>',
  share:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6"/><path d="M9 12h6"/></svg>',
  me:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>',
  cam:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8a2 2 0 0 1 2-2h2l1.5-2h5L16 6h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  up:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 8 5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>',
  qr:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM18 18h3v3h-3z"/></svg>',

async function api(action, data={}, ident){

/* ---------- money logic ---------- */
function myTicket(id){ return home.mine.find(t=>t.id===id) || null; }
function partTotal(t, q){ return r2((t.items||[]).reduce((s,it,i)=>s+(q[i]||0)*it.unitPrice,0)); }
const ownerPart = t => partTotal(t, t.ownerQ||{});
function personName(t, c){ return ((t.people||[]).find(p=>p.pid===c.pid)||{}).name || c.name; }
// Everyone who should pay you back for this ticket, with their status.
function rowsOf(t){
  const claims = t.claims||[], people = t.people||[];
  const rows = people.map(p=>{
    const c = claims.find(x=>x.pid===p.pid) || null;
    return { key:"p-"+p.pid, pid:p.pid, name:p.name, claim:c, manual:!!p.paid, paid:!!(p.paid || c?.paid), total:c?.total||0, chose:!!(c && c.total>0) };
  });
  claims.filter(c=>c.total>0 && !people.some(p=>p.pid===c.pid)).forEach(c=>rows.push(
    { key:"u-"+c.userId, pid:null, name:c.name, claim:c, manual:false, paid:!!c.paid, total:c.total, chose:true }));
  return rows;
}
function openAmount(t, rows){
  const claimed = (t.claims||[]).reduce((s,c)=>s+(c.total||0),0);
  const unclaimed = Math.max(0, r2(sum(t) - ownerPart(t) - claimed));
  const chosenUnpaid = rows.filter(r=>!r.paid).reduce((s,r)=>s+r.total,0);
  const someoneMustStillChoose = rows.some(r=>!r.paid && !r.chose);
  return r2(chosenUnpaid + (someoneMustStillChoose ? unclaimed : 0));
}
function takenByOthers(t, claims, i){ return (t.ownerQ?.[i]||0) + (claims||[]).filter(c=>c.userId!==me.id).reduce((s,c)=>s+(c.q?.[i]||0),0); }
function recentNames(){
  const seen = new Map();
  for(const t of home.mine){
    for(const p of t.people||[]) if(!seen.has(p.name.toLowerCase())) seen.set(p.name.toLowerCase(), p.name);
    for(const c of t.claims||[]) if(c.total>0 && !seen.has(c.name.toLowerCase())) seen.set(c.name.toLowerCase(), c.name);
  }
  return [...seen.values()].filter(n=>n.toLowerCase()!==(me.name||"").toLowerCase());
}
function payUrl(t, amount){ return `https://bunq.me/${encodeURIComponent(t.payee||"")}/${amount.toFixed(2)}/${encodeURIComponent((t.title||"Ticket").slice(0,60))}`; }

// Verklein de foto voor het versturen: sneller en goedkoper, nog scherp genoeg om te lezen.
async function shrinkPhoto(file, max=1800, quality=0.82){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((ok,fail)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=()=>fail(new Error("De foto kon niet geopend worden.")); i.src=url; });
    const s=Math.min(1, max/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement("canvas"); c.width=Math.round(img.naturalWidth*s); c.height=Math.round(img.naturalHeight*s);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    return c.toDataURL("image/jpeg",quality).split(",")[1];
  } finally { URL.revokeObjectURL(url); }
}

    if(run!==readRun) return;
    S.layer=null;
    if(!r.items?.length){ S.aiErr="Claude vond geen lijnen op deze foto. Probeer een scherpere foto, of plak de tekst zelf."; S.view="scan"; render(); window.scrollTo(0,0); return; }
    try{ navigator.vibrate?.(10); }catch{}
    startNew(r.items, r.title, r.total, true);
  }catch(e){
    if(run!==readRun) return;
    S.layer=null; S.aiErr=e.message; S.view="scan"; render(); window.scrollTo(0,0);
  }
}

function openSetup(isNew){

    S.setup={ isNew:true, items, people:[], ownerQ:{}, claims:[] };
  }else{

    S.setup={ isNew:false, items:t.items, people:(t.people||[]).map(p=>({...p})), ownerQ:{...(t.ownerQ||{})}, claims:t.claims||[] };
  }

function addPerson(name){
  const n=String(name||"").trim().replace(/\s+/g," ").slice(0,30); if(!n) return;
  if(S.setup.people.some(p=>p.name.toLowerCase()===n.toLowerCase())){ toast(`${n} staat er al bij.`); return; }
  const pid="p"+rand(4); S.setup.people.push({ pid, name:n }); S.popPid=pid;
  render(); const inp=$("addName"); if(inp){ inp.value=""; inp.focus(); }
}
async function saveSetup(el){

  }

function viewKrijgen(){

  const focused = document.activeElement && document.activeElement.id;
  const app=$("app");
  app.innerHTML = html;
  S.popPid = null;
  if(v!==lastView){ lastView=v; app.classList.remove("enter"); void app.offsetWidth; app.classList.add("enter"); clearTimeout(enterT); enterT=setTimeout(()=>app.classList.remove("enter"),420); }

      ${isIOS?`<div class="isteps">
        <div class="istep"><span class="ic">${ICON.up}</span><div class="col"><span style="font-weight:600">Tik in Safari op de Deel-knop</span><span class="t2">Zie je die niet? Tik eerst op ⋯ naast de adresbalk.</span></div></div>
        <div class="istep"><span class="ic">${ICON.plus}</span><div class="col"><span style="font-weight:600">Kies "Zet op beginscherm"</span><span class="t2">Scroll in het menu omlaag als je het niet meteen ziet.</span></div></div>
        <div class="istep"><span class="ic">${ICON.check}</span><div class="col"><span style="font-weight:600">Tik op "Voeg toe"</span><span class="t2">Je profiel gaat mee naar de app. Lukt dat niet, gebruik dan je koppelcode onder Profiel.</span></div></div></div>`
      :`<span class="t2">Open deze pagina op je iPhone in Safari en tik daar op Installeer. Op Android of in Chrome gebeurt het met één tik.</span>`}
      <button class="btn-p" data-act="closeLayer">Begrepen</button></div></div>`;
    return;
  }
  if(l.kind==="qr"){
    const t=myTicket(S.id); if(!t){ S.layer=null; L.innerHTML=""; return; }
    const rows=rowsOf(t), chose=rows.filter(r=>r.chose).map(r=>r.name);
    L.innerHTML=`<div class="layer qr"><div style="align-self:stretch;max-width:520px;width:100%;margin:0 auto"><button class="btn-link" data-act="closeLayer">‹ Ticket</button></div>
      <div style="text-align:center;display:flex;flex-direction:column;gap:6px"><h1 style="font-size:30px">${esc(t.title)}</h1><span style="color:rgba(255,255,255,.85)">Laat je vrienden deze code scannen met hun camera</span></div>
      <div class="qrbox" role="img" aria-label="QR-code naar dit ticket"><div id="qr"></div></div>
      <span>${chose.length?esc(listNames(chose))+(chose.length===1?" koos":" kozen")+" al een deel":"Nog niemand koos een deel"}</span>
      <button class="btn" style="background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.35);color:#fff;width:100%;max-width:360px;height:56px;border-radius:28px" data-act="shareLink">${ICON.up} Of deel de link</button></div>`;
    if(window.QRCode) new QRCode($("qr"),{text:linkFor(t),width:240,height:240,colorDark:"#14202b",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M});
    try{ navigator.wakeLock?.request("screen").catch(()=>{}); }catch{}
  }
}

/* ---------- events ---------- */
document.addEventListener("click", async ev=>{
  const el=ev.target.closest("[data-act]"); if(!el) return;
  const a=el.dataset.act, i=+el.dataset.i;
  switch(a){
    case "onboard": { const n=$("obName").value.trim(); if(!n){ setFlash(el,"err"); $("obName").focus(); return; } me.name=n.slice(0,30); store.set("me",me);
      try{ await withFlash(el, ()=>api("hello",{ bunq:me.bunq, iban:me.iban })); await wait(250); }catch{} render(); await refresh(); readHash(); break; }
    case "toggleImport": S.showImport=!S.showImport; render(); break;
    case "doImport": try{ await withFlash(el, ()=>importCode($("obCode").value)); await wait(250); S.showImport=false; render(); await refresh(); readHash(); toast("Profiel gekoppeld."); }catch(e){ toast(e.message); } break;
    case "retry": await withFlash(el, refresh); break;
    case "tab": go(el.dataset.v); break;
    case "camera": $("cam").value=""; $("cam").click(); break;
    case "cancelScan": go("krijgen"); break;
    case "aiRetry": S.aiErr=""; readWithAI(); break;
    case "aiCancel": readRun++; S.layer=null; S.aiErr=""; S.view="scan"; render(); break;
    case "manual": startNew([], "", 0); break;
    case "parse": { const txt=($("paste")?.value||"").trim(); if(!txt){ setFlash(el,"err"); toast("Plak eerst de tekst van het ticket."); return; }
      const r=parseReceipt(txt); if(!r.items.length) toast("Geen lijnen gevonden. Vul ze zelf in."); startNew(r.items, r.title, r.total); break; }
    case "cancelNew": S.draft=null; go("krijgen"); break;
    case "next": openSetup(true); break;
    case "setup": openSetup(false); break;
    case "setupBack": if(S.setup?.isNew){ S.setup=null; S.view="new"; render(); } else { S.setup=null; go("ticket",S.id); } break;
    case "addPerson": addPerson($("addName")?.value); break;
    case "addSug": addPerson(el.dataset.v); break;
    case "rmPerson": S.setup.people.splice(i,1); render(); break;
    case "oinc": case "odec": { const q=(S.setup.ownerQ[i]||0)+(a==="oinc"?1:-1); if(q>0) S.setup.ownerQ[i]=q; else delete S.setup.ownerQ[i]; bumpSel=`[data-k="o${i}"],#owntotal`; render(); break; }
    case "saveSetup": saveSetup(el); break;
    case "open": S.justMade=null; go("ticket", el.dataset.id); break;
    case "back": clearHash(); go("krijgen"); break;
    case "toDelen": clearHash(); go("delen"); break;
    case "remind": { const t=myTicket(el.dataset.id), w=rowsOf(t).filter(r=>!r.paid);
      if(!w.length){ shareText(`Duid aan wat je had bij ${t.title} en betaal je deel:`, linkFor(t)); break; }
      if(w.length===1){ remindRow(t,w[0]); break; }
      S.layer={kind:"remind", id:t.id}; render(); break; }
    case "remindOne": { const t=myTicket(el.dataset.id), r=t && rowsOf(t).find(x=>x.key===el.dataset.key); if(r) remindRow(t,r); break; }
    case "markPerson": try{ await withFlash(el, ()=>api("markPerson",{ id:S.id, pid:el.dataset.pid, paid:el.dataset.v==="1" })); await wait(300); await refresh(); toast(el.dataset.v==="1"?"Gemarkeerd als betaald.":"Weer op open gezet."); }catch(e){ toast(e.message); } break;
    case "shareLink": { const t=myTicket(S.id); shareText(`Duid aan wat je had bij ${t.title} en betaal je deel:`, linkFor(t)); break; }
    case "showQR": S.layer={kind:"qr"}; render(); break;
    case "closeLayer": S.layer=null; render(); break;
    case "copyVal": await copy(el.dataset.v); if(!S.layer || S.layer.kind!=="copy") setFlash(el,"done"); break;
    case "copyCode": await copy(codeOf(), "Koppelcode gekopieerd."); if(!S.layer) setFlash(el,"done"); break;
    case "install":
      if(installEvt){ installEvt.prompt(); try{ await installEvt.userChoice; }catch{} installEvt=null; render(); break; }
      try{ history.replaceState(null,"",location.pathname+location.search+"#koppel="+codeOf()); }catch{}
      S.layer={kind:"install"}; render(); break;
    case "edit": { const t=myTicket(S.id); S.editing=true; S.draft={ title:t.title, items:t.items.map(x=>({...x})), ticketTotal:t.ticketTotal||0 }; render(); break; }
    case "cancelEdit": S.editing=false; S.err=""; render(); break;
    case "saveEdit": saveEdit(el); break;
    case "addRow": S.draft.items.push({name:"",qty:1,unitPrice:0}); render(); break;
    case "delRow": S.draft.items.splice(i,1); render(); break;
    case "del": S.confirmDel=true; render(); break;
    case "delNo": S.confirmDel=false; render(); break;
    case "delYes": deleteTicket(el); break;
    case "pickPid": S.pid=el.dataset.v; render(); queueClaim(S.id); break;
    case "inc": case "dec": S.mine[i]=(S.mine[i]||0)+(a==="inc"?1:-1); if(S.mine[i]<=0) delete S.mine[i]; bumpSel=`[data-k="m${i}"],#paytotal`; render(); queueClaim(S.id); break;
    case "adjust": if(!cache[el.dataset.id]) await loadTicket(el.dataset.id); go("select", el.dataset.id); break;
    case "pay": if(S.view==="select") saveClaim(el.dataset.id); break;
    case "payIban": { const id=el.dataset.id, sh=home.shares.find(x=>x.ticket.id===id)||{}, e=cache[id] || { ticket:sh.ticket, ownerName:sh.ownerName };
      if(S.view==="select") saveClaim(id);
      S.layer={ kind:"iban", iban:e.ticket?.iban||"", name:e.ownerName||"", amount:+el.dataset.amt, msg:`${me.name} – ${e.ticket?.title||"Ticket"}`.slice(0,60) }; render(); break; }
    case "setPaid": { const id=el.dataset.id; setFlash(el,"busy"); if(!cache[id]) await loadTicket(id);
      if(S.view!=="select"){ const mc=(cache[id]?.claims||[]).find(c=>c.userId===me.id); S.mine={...(mc?.q||{})}; S.pid=mc?.pid ?? null; }
      await withFlash(el, ()=>saveClaim(id,{ paid: el.dataset.v==="1" })); toast(el.dataset.v==="1"?"Gemarkeerd als betaald.":"Weer op open gezet."); break; }
    case "theme": store.set("theme", el.dataset.v); applyTheme(el.dataset.v); render(); break;
    case "saveProfile": { const n=$("pName").value.trim(), b=$("pBunq").value.trim().replace(/^https?:\/\/(www\.)?bunq\.me\//i,"").replace(/\/.*$/,""), ib=$("pIban").value.trim().toUpperCase();
      if(!n){ setFlash(el,"err"); toast("Vul je naam in."); return; }
      if(b && !/^[A-Za-z0-9._-]+$/.test(b)){ setFlash(el,"err"); toast("Vul alleen je bunq.me-naam in, bv. JanPeeters."); return; }
      if(ib && !/^[A-Z]{2}\d{2}[A-Z0-9 ]{10,30}$/.test(ib)){ setFlash(el,"err"); toast("Dat rekeningnummer lijkt niet te kloppen."); return; }
      me.name=n.slice(0,30); me.bunq=b; me.iban=ib; store.set("me",me);
      try{ await withFlash(el, ()=>api("hello",{ bunq:b, iban:ib })); refresh(); }catch(e){ toast(e.message); } break; }
  }
});
document.addEventListener("input", ev=>{
  const el=ev.target, k=el.dataset.in; if(!k) return;
  if(k==="paste"){ S.pasted=el.value; return; }
  if(!S.draft) return;
  if(k==="title"){ S.draft.title=el.value; return; }
  const it=S.draft.items[+el.dataset.i];
  if(k==="name") it.name=el.value;
  if(k==="qty") it.qty=Math.max(1,parseInt(el.value)||1);
  if(k==="price") it.unitPrice=parseFloat(el.value.replace(",","."))||0;
  const tot=r2(S.draft.items.reduce((s,x)=>s+x.qty*x.unitPrice,0));
  if($("etot")) $("etot").textContent=eur(tot);
  if($("echeck")) $("echeck").hidden = Math.abs(S.draft.ticketTotal-tot)<=0.01;
});
document.addEventListener("keydown", ev=>{
  const id=ev.target.id;
  if(ev.key==="Enter" && id==="obName"){ ev.preventDefault(); document.querySelector('[data-act="onboard"]').click(); return; }
  if(ev.key==="Enter" && id==="addName"){ ev.preventDefault(); addPerson(ev.target.value); return; }
  if((ev.key==="Enter"||ev.key===" ") && ev.target.getAttribute("role")==="button" && ev.target.dataset.act){ ev.preventDefault(); ev.target.click(); }
});

/* ---------- pull to refresh ---------- */
const PTR = { y0:null, x0:0, dy:0, on:false, busy:false, ready:false };
const PTR_GO = 62, PTR_MAX = 100, PTR_HOLD = 52;
const ptrAllowed = () => me.name && !S.layer && (S.view==="krijgen" || S.view==="delen" || (S.view==="ticket" && !S.editing));
function setPull(y, mode){ // mode: "drag" | "spin" | "back"
  const app=$("app"), el=$("ptr"), arc=el.querySelector(".arc");
  const ease = mode==="drag" ? "none" : "transform .34s cubic-bezier(.2,.8,.2,1)";
  app.style.transition = ease;
  app.style.transform = y ? `translateY(${y}px)` : "";
  const p = Math.min(1, y/PTR_GO);
  el.style.transition = mode==="drag" ? "none" : "opacity .25s, transform .34s cubic-bezier(.2,.8,.2,1)";
  el.style.opacity = mode==="back" ? 0 : (y ? Math.max(.2,p) : 0);
  el.style.transform = `translate(-50%, ${Math.max(0, y*0.42)}px)`;
  el.classList.toggle("spin", mode==="spin");
  el.classList.toggle("ready", mode==="drag" && p>=1);
  if(mode!=="spin") arc.style.strokeDashoffset = String(62.83*(1-p*0.82));
}
document.addEventListener("touchstart", e=>{
  if(PTR.busy || !ptrAllowed() || window.scrollY>0 || e.touches.length!==1) return;
  if(e.target.closest("input,textarea")) return;
  PTR.y0=e.touches[0].clientY; PTR.x0=e.touches[0].clientX; PTR.dy=0; PTR.on=false; PTR.ready=false;
},{ passive:true });
document.addEventListener("touchmove", e=>{
  if(PTR.y0===null) return;
  const dy=e.touches[0].clientY-PTR.y0, dx=Math.abs(e.touches[0].clientX-PTR.x0);
  if(!PTR.on && (dy<6 || dx>dy)){ if(dy<0||dx>dy) PTR.y0=null; return; }
  if(window.scrollY>0){ PTR.y0=null; return; }
  PTR.on=true; e.preventDefault();
  const raw = Math.max(0,dy)*0.55; PTR.dy = raw<PTR_GO ? raw : Math.min(PTR_MAX, PTR_GO + (raw-PTR_GO)*0.35); // na de drempel: zwaarder
  const ready = PTR.dy>=PTR_GO;
  if(ready && !PTR.ready){ try{ navigator.vibrate?.(6); }catch{} }
  PTR.ready = ready;
  setPull(PTR.dy, "drag");
},{ passive:false });
document.addEventListener("touchend", async ()=>{
  if(PTR.y0===null) return;
  PTR.y0=null; if(!PTR.on) return; PTR.on=false;
  if(PTR.ready){
    PTR.busy=true; setPull(PTR_HOLD, "spin");
    const t0=Date.now();
    await refresh();
    if(S.view==="ticket" && S.id) render();
    await wait(Math.max(0, 750-(Date.now()-t0)));
    PTR.busy=false;
    if(loadErr) toast("Bijwerken lukte niet. Controleer je verbinding.");
  }
  setPull(0, "back");
});
document.addEventListener("touchcancel", ()=>{ if(PTR.on && !PTR.busy){ PTR.y0=null; PTR.on=false; setPull(0,"back"); } });

/* ---------- boot ---------- */
(async()=>{
  const km=/^#koppel=(.+)$/.exec(location.hash||"");
  if(km){
    const c=parseCode(decodeURIComponent(km[1]));
    if(c && c.id!==me.id && !me.name){ try{ await importCode(c.id+"."+c.key); }catch{} }
    clearHash();
  }
  render();
  if(me.name){ await refresh(); readHash(); }
})();
</script>
